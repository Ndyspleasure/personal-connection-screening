name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pcs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pcs
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json "packageManager"; do not also set it here.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm --filter @pcs/db db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Boots the built public app and drives the real HTTP routes end to end.
      # Uses its own dedicated database (created on the same Postgres service),
      # so it never touches the integration-test schema above.
      - name: E2E (public journey)
        run: pnpm --filter @pcs/e2e test:e2e
